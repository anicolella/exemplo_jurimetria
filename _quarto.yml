project:
  type: default
  output-dir: output
  render:
    - relatorio.qmd

lang: pt-BR
bibliography: referencias.bib

format:
  pdf:
    documentclass: article
    pdf-engine: xelatex
    papersize: a4
    geometry:
      - top=22mm
      - bottom=22mm
      - left=24mm
      - right=24mm
    fontsize: 11pt
    mainfont: "TeX Gyre Heros"
    sansfont: "TeX Gyre Heros"
    toc: true
    number-sections: true
    colorlinks: true
    linkcolor: azul-marinho
    urlcolor: azul-medio
    citecolor: marrom-suave
    include-in-header: tema-moderno.tex

execute:
  echo: true
  warning: false
  message: false
